[platformio]
description = interface for SD card through SPI protocol.
name = SD

[env]
; to generate 'compile_commands.json' for cmaked lsp
; generate the file with: pio run -e demo -t compiledb 
extra_scripts = pre:test/compile_db_options.py

platform = atmelavr
board = ATmega328P
lib_deps = 
	https://github.com/m328pb/spi
	https://github.com/m328pb/strings
	https://github.com/m328pb/petitfatfs

[env:demo]
upload_protocol = usbasp
upload_command = /usr/bin/avrdude -c usbasp -p m328p -U flash:w:.pio/build/demo/firmware.hex
build_flags = 
	-pedantic
	-O3
	-Os
	-std=gnu++1z
build_src_filter = +<*.cpp> +<*.c> +<../examples/main.cpp>

[env:mem_usage]
build_flags =
	-pedantic
	-O3
	-Os
	-std=gnu++1z
build_src_filter = +<*.cpp> +<../examples/main_memtest.cpp>
